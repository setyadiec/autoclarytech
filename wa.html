<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Menghubungkan ke WhatsApp Resmi AutoClaryTech...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/config.js"></script>
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var text = urlParams.get('text') || 'Halo AutoClaryTech, saya ingin konsultasi sistem.';
      var waNumber = (window.SITUS && window.SITUS.waNomor) ? window.SITUS.waNomor : '6285727240341';
      var targetUrl = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(text);
      window.location.replace(targetUrl);
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0b0f19; color: #e2e8f0; text-align: center; }
    .box { padding: 32px; border-radius: 16px; background: #111827; border: 1px solid #1f2937; max-width: 420px; }
    .btn { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #128c4a; color: #fff; font-weight: 700; text-decoration: none; border-radius: 8px; }
    .btn:hover { background: #0e7a40; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 32px; margin-bottom: 12px;">💬</div>
    <h3 style="margin: 0; font-size: 18px;">Menghubungkan ke WhatsApp AutoClaryTech...</h3>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 10px; line-height: 1.5;">
      Sistem sedang mengalihkan Anda ke saluran WhatsApp resmi kami. Jika tidak berpindah otomatis dalam 3 detik, silakan klik tombol di bawah:
    </p>
    <a id="btnWa" class="btn" href="#">Buka WhatsApp Sekarang &rarr;</a>
  </div>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var text = urlParams.get('text') || 'Halo AutoClaryTech, saya ingin konsultasi sistem.';
    var waNumber = (window.SITUS && window.SITUS.waNomor) ? window.SITUS.waNomor : '6285727240341';
    var targetUrl = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(text);
    document.getElementById('btnWa').href = targetUrl;
  </script>
</body>
</html>
