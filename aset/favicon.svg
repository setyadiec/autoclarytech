<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="cyanToscaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="topCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Facet 1: Left Diamond Apex Core (Tosca / Emerald Teal) -->
  <polygon points="70,256 195,150 270,256 195,362" fill="#0f766e" />

  <!-- Facet 2: Upper Left Diamond Wing (Bright Radiant Tosca) -->
  <polygon points="70,256 270,56 270,165 195,150" fill="#14b8a6" />

  <!-- Facet 3: Upper Right Arm of 'C' (Electric Cyan) -->
  <polygon points="270,56 442,145 325,215 270,165" fill="#22d3ee" />

  <!-- Facet 4: Inner Top Refraction Highlight (Ice Cyan Glaze) -->
  <polygon points="195,150 270,165 325,215 270,256" fill="#a5f3fc" />

  <!-- Facet 5: Lower Left Diamond Wing (Deep Tosca Shadow) -->
  <polygon points="70,256 195,362 270,347 270,456" fill="#115e59" />

  <!-- Facet 6: Lower Right Arm of 'C' (Bright Sky Cyan) -->
  <polygon points="270,456 442,367 325,297 270,347" fill="#38bdf8" />

  <!-- Facet 7: Inner Bottom Refraction (Teal Ocean) -->
  <polygon points="195,362 270,256 325,297 270,347" fill="#0d9488" />

  <!-- Crisp Facet Seams (White Micro-Strokes) -->
  <polyline points="70,256 270,56 442,145 325,215 270,256 325,297 442,367 270,456 70,256" 
            fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
  <line x1="70" y1="256" x2="270" y2="256" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="270" y1="56" x2="270" y2="456" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
</svg>