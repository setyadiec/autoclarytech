<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Akun — AutoClaryTech (ACT)</title>
  <meta name="description" content="Pendaftaran mandiri akun AutoClaryTech CS AI WhatsApp untuk UMKM.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; line-height: 1.6; padding: 40px 20px; }
    .container { max-width: 540px; margin: 0 auto; background: #111827; padding: 36px; border-radius: 16px; border: 1px solid #1f2937; }
    h1 { color: #00d2b4; font-size: 24px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #00d2b4; }
    .submit-btn { width: 100%; padding: 14px; background: #00d2b4; color: #0b0f19; font-weight: 700; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .submit-btn:hover { background: #00b89d; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-decoration: none; }
    .back-btn:hover { color: #00d2b4; }
    .note { font-size: 12px; color: #64748b; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Kembali ke Beranda</a>
    <h1>Pendaftaran Akun Baru</h1>
    <p>Aktifkan kuota gratis 100 balasan CS AI WhatsApp sekarang tanpa kartu kredit.</p>

    <form onsubmit="handleDaftar(event)">
      <div class="form-group">
        <label for="namaToko">Nama Usaha / Toko</label>
        <input type="text" id="namaToko" required placeholder="Contoh: Kopi Senja / Warung Berkah">
      </div>
      <div class="form-group">
        <label for="namaOwner">Nama Pemilik / Pengelola</label>
        <input type="text" id="namaOwner" required placeholder="Contoh: Budi Santoso">
      </div>
      <div class="form-group">
        <label for="waOwner">Nomor WhatsApp Aktif</label>
        <input type="tel" id="waOwner" required placeholder="Contoh: 081234567890">
      </div>
      <div class="form-group">
        <label for="kategori">Kategori Bisnis</label>
        <select id="kategori">
          <option value="Kuliner / Kafe / Resto">Kuliner / Kafe / Resto</option>
          <option value="Rental Kendaraan / Persewaan">Rental Kendaraan / Persewaan</option>
          <option value="Fashion / Retail / Olshop">Fashion / Retail / Olshop</option>
          <option value="Jasa / Bengkel / Salon">Jasa / Bengkel / Salon</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <button type="submit" class="submit-btn">Kirim & Aktifkan Kuota 100 Chat</button>
      <div class="note">Dengan mendaftar, Anda menyetujui <a href="syarat.html" style="color: #00d2b4;">Syarat & Ketentuan</a> kami.</div>
    </form>
  </div>

  <script>
    function handleDaftar(e) {
      e.preventDefault();
      var toko = document.getElementById('namaToko').value.trim();
      var owner = document.getElementById('namaOwner').value.trim();
      var wa = document.getElementById('waOwner').value.trim();
      var kat = document.getElementById('kategori').value;

      var pesan = "Halo AutoClaryTech, saya mendaftar akun toko baru:\n\n" +
                  "• Usaha: " + toko + "\n" +
                  "• Pemilik: " + owner + "\n" +
                  "• WhatsApp: " + wa + "\n" +
                  "• Kategori: " + kat + "\n\n" +
                  "Mohon diproses aktivasi kuota gratis 100 balasan.";

      window.location.href = "https://wa.me/6285727240341?text=" + encodeURIComponent(pesan);
    }
  </script>
</body>
</html>
